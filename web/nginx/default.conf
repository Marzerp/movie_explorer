# Configuración HTTPS
server {
    listen 443 ssl;
    server_name movieexp.com.mx www.movieexp.com.mx;  # ← Usa tu dominio aquí

    # Ruta de los certificados SSL (ajusta según tu estructura)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Configuraciones de seguridad SSL/TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Configuraciones de tu aplicación (conservadas)
    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /reporte/ {
        alias /output/;
        try_files $uri $uri/ =404;
    }

    location /static/ {
        alias /app/static/;
    }
}
