upstream flask_app {
    server app:8080;  # Usa el nombre del servicio de compose
}

server {
    listen 80;
    listen [::]:80;

    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
    }

    location /reporte/ {
        alias /output/;
        try_files $uri $uri/ =404;
    }

    location /static/ {
        alias /app/static/;
    }
}
